[project]
name = "enterprise-support-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ljc", email = "312143140@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "boto3>=1.43.123",
    "boto3-stubs~=1.43.123",
    "fastapi[standard]>=0.162.0",
    "langchain-openai>=1.7.3",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.4",
    "qdrant-client>=1.20.0",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
enterprise-support-agent = "enterprise_support_agent:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
